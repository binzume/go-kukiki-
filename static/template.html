<!DOCTYPE html>
<html>
 <head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta http-equiv="Content-Script-Type" content="text/javascript" />
  <meta http-equiv="Content-Style-Type" content="text/css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>{{ .title }}{{if .siteTitle}} - {{.siteTitle}}{{end}}</title>
  <link rel="stylesheet" href="/css/style.css">
 </head>
 <body>
{{if or .loggedIn .editURL}}
<nav class="page-links" aria-label="Page actions">
{{if .loggedIn}}<a href="/logout">ログアウト</a>{{end}}
{{if .editURL}}<a href="{{.editURL}}">Edit</a>{{end}}
</nav>
{{end}}
{{if .breadcrumbs}}
<nav class="breadcrumbs" aria-label="Breadcrumb">
{{range $index, $item := .breadcrumbs}}{{if $index}} / {{end}}<a href="{{$item.URL}}">{{$item.Title}}</a>{{end}} /
</nav>
{{end}}
<div id="content">
{{.ctx | markdown}}
</div>

 </body>
</html>
