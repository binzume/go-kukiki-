<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
	<title>{{.title}}{{if .siteTitle}} - {{.siteTitle}}{{end}} - Leafy Editor</title>
	<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
	<link rel=stylesheet type="text/css" href="/css/leafy.css" />
	<script src="/js/leafy-markdown.js"></script>
	<script src="/js/leafy-editor.js"></script>
</head>
<body>
<header>
  Leafy Editor
  {{if .loggedIn}}<a href="/logout">ログアウト</a>{{end}}
</header>

Page: <span id="pagepath">{{.page}}</span>
Section: <input type="text" id="sectionpath" value="{{.section}}" />
<button id="save-button">Save</button>
<span id="save-status" role="status" aria-live="polite"></span>

<div id="content" style="height:calc(100vh - 80pt);">


<div id="editor-pane">
<textarea id="editor" style="width:100%;height:100%"></textarea>
</div>
<div id="preview-pane" class="leafy-content">
</div>

</div>

</body>
</html>
